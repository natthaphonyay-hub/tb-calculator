<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TB Calculator</title>
<meta name="description" content="คำนวณขนาดยาวัณโรคสูตร 2HRZE/4HR ตามน้ำหนัก เริ่มยาใหม่และปรับยา พร้อม Pharmacist note">
</head>
<body>
<p>TB Calculator อยู่ระหว่างทำหน้าจอ (ชุด ค) ตอนนี้มีแต่ตัวคำนวณ</p>
<script>
'use strict';
// DATA-START
/* ข้อมูลยาและกติกา ทุกค่ามีที่มา สเปก: ../01-สเปกกติกาคำนวณ.md
   [N] แนวทางการควบคุมวัณโรคประเทศไทย พ.ศ. 2564 เลขหน้าในเล่ม
   [พี่] พี่เคาะ 2026-11-08 */
const DRUGS = {
  // ช่วง มก./กก./วัน [N 60 หัวตาราง 5.1] · เป้า H R Z = กึ่งกลางช่วง, E 15 [N 62] · ขนาดสูงสุด = ค่าสูงสุดที่ตาราง 5.1 ใช้ [N 60]
  // ขนาดเม็ด: เม็ดเดี่ยวที่ รพ. มี [พี่]
  H: { name: 'Isoniazid', short: 'INH', unit: 'tab', th: 'เม็ด', strengths: [100], lo: 4, hi: 6, target: 5, cap: 300 },
  R: { name: 'Rifampicin', short: 'Rifampicin', unit: 'cap', th: 'แคปซูล', strengths: [300, 450], lo: 8, hi: 12, target: 10, cap: 600 },
  Z: { name: 'Pyrazinamide', short: 'PZA', unit: 'tab', th: 'เม็ด', strengths: [500], lo: 20, hi: 30, target: 25, cap: null },
  E: { name: 'Ethambutol', short: 'Ethambutol', unit: 'tab', th: 'เม็ด', strengths: [400, 500], lo: 15, hi: 20, target: 15, cap: null },
};
const ORDER = ['H', 'R', 'Z', 'E'];
const PHASE_DRUGS = { intensive: ['H', 'R', 'Z', 'E'], continuation: ['H', 'R'] };
const PHASE_TH = { intensive: 'ระยะเข้มข้น (HRZE)', continuation: 'ระยะต่อเนื่อง (HR)' };
// ตาราง 5.1 [N 60] ตัดแถวที่ 50 และ 70 กก. [พี่] น้ำหนักเก็บเป็นหน่วย 0.1 กก. (w10)
const ROWS = [
  { key: 'row1', label: '35-49.9 kg', lo10: 350, hi10: 500, dose: { H: 300, R: 450, Z: 1000, E: 800 } },
  { key: 'row2', label: '50-69.9 kg', lo10: 500, hi10: 700, dose: { H: 300, R: 600, Z: 1500, E: 1000 } },
  { key: 'row3', label: '70 kg ขึ้นไป', lo10: 700, hi10: null, dose: { H: 300, R: 600, Z: 2000, E: 1200 } },
];
const CALC_BELOW10 = 350;   // น้อยกว่า 35 กก. คำนวณตามน้ำหนัก [N 60 หมายเหตุ]
const MAX_UNITS = 8;        // จำนวนเม็ดสูงสุดต่อยาที่เครื่องมือเสนอเอง [สเปก 4.2]
const W10_MIN = 200, W10_MAX = 2000; // รับ 20.0 ถึง 200.0 กก. [สเปก 5.3]
const AGE_MIN = 16;         // อายุมากกว่า 15 ปี [N 60 หัวตาราง 5.1]
const REF_LINE = 'อ้างอิง แนวทางการควบคุมวัณโรคประเทศไทย พ.ศ. 2564';
// DATA-END

// CALC-START
/* ---------- ตัวเลข ---------- */
function parseWeight(text) { // คืนน้ำหนักหน่วย 0.1 กก. หรือรหัสเหตุผล
  const s = String(text == null ? '' : text).trim();
  const m = /^(\d+)(?:\.(\d))?$/.exec(s);
  if (!m) return { ok: false, reason: 'decimal' };
  const w10 = Number(m[1]) * 10 + (m[2] ? Number(m[2]) : 0);
  if (w10 < W10_MIN || w10 > W10_MAX) return { ok: false, reason: 'weight' };
  return { ok: true, w10 };
}
function parseAge(age) {
  const n = typeof age === 'number' ? age : (/^\d{1,3}$/.test(String(age).trim()) ? Number(String(age).trim()) : NaN);
  return Number.isInteger(n) && n >= AGE_MIN ? { ok: true, age: n } : { ok: false, reason: 'age' };
}
// มก./กก. คูณ 10 ปัดครึ่งขึ้น ด้วยเลขจำนวนเต็มล้วน [สเปก 4.3]
function mgkg10(dose, w10) { return Math.floor((dose * 200 + w10) / (2 * w10)); }
function fmt10(t) { return Math.floor(t / 10) + '.' + (t % 10); }
function fmtW(w10) { return fmt10(w10); }
function num(x) { return String(x).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function inRange(code, t) { const d = DRUGS[code]; return t >= d.lo * 10 && t <= d.hi * 10; }

/* ---------- จัดเม็ด ---------- */
const COMBOS = {};
function buildCombos(code) {
  const s = DRUGS[code].strengths, cap = DRUGS[code].cap, best = new Map();
  const counts = new Array(s.length).fill(0);
  const better = (a, b) => { // a ดีกว่า b: เม็ดน้อยกว่า แล้วเม็ดขนาดใหญ่มากกว่า
    const na = a.reduce((x, y) => x + y, 0), nb = b.reduce((x, y) => x + y, 0);
    if (na !== nb) return na < nb;
    for (let i = s.length - 1; i >= 0; i--) if (a[i] !== b[i]) return a[i] > b[i];
    return false;
  };
  (function rec(i) {
    if (i === s.length) {
      const n = counts.reduce((x, y) => x + y, 0);
      if (n === 0 || n > MAX_UNITS) return;
      const dose = counts.reduce((x, c, j) => x + c * s[j], 0);
      if (cap != null && dose > cap) return;
      const cur = best.get(dose);
      if (!cur || better(counts, cur)) best.set(dose, counts.slice());
      return;
    }
    for (let c = 0; c <= MAX_UNITS; c++) { counts[i] = c; rec(i + 1); }
    counts[i] = 0;
  })(0);
  return best;
}
for (const c of ORDER) COMBOS[c] = buildCombos(c);
function unitsOf(code, dose) { const k = COMBOS[code].get(dose); return k ? k.reduce((x, y) => x + y, 0) : Infinity; }
function tabsMap(code, dose) { // {"400": 2, "500": 1}
  const k = COMBOS[code].get(dose), out = {};
  if (!k) return null;
  DRUGS[code].strengths.forEach((s, i) => { if (k[i] > 0) out[String(s)] = k[i]; });
  return out;
}
function tabsFromCounts(code, tabs) { // จำนวนเม็ดที่เภสัชกรอก -> มก.
  return DRUGS[code].strengths.reduce((x, s) => x + s * (Number(tabs[String(s)]) || 0), 0);
}
function tabsText(code, tabs, lang) {
  const d = DRUGS[code];
  return d.strengths.filter(s => (tabs[String(s)] || 0) > 0)
    .map(s => lang === 'th' ? `${s} มก. ${tabs[String(s)]} ${d.th}` : `${s} mg ${tabs[String(s)]} ${d.unit}`).join(' + ');
}

/* ---------- ขนาดยา ---------- */
function chooseCalc(code, w10) { // สเปก 4.2
  const d = DRUGS[code];
  const dist = dose => Math.abs(dose * 10 - d.target * w10); // ระยะจากเป้า หน่วย มก. คูณ 10
  const cands = [...COMBOS[code].keys()].sort((a, b) => a - b);
  const inr = cands.filter(x => inRange(code, mgkg10(x, w10)));
  if (inr.length) {
    const pick = inr.reduce((b, x) => {
      const kx = [dist(x), unitsOf(code, x), -x], kb = [dist(b), unitsOf(code, b), -b];
      for (let i = 0; i < 3; i++) if (kx[i] !== kb[i]) return kx[i] < kb[i] ? x : b;
      return b;
    });
    return { dose: pick, nowhole: false, alt: [] };
  }
  const pick = cands.reduce((b, x) => (dist(x) < dist(b) || (dist(x) === dist(b) && x > b)) ? x : b);
  const alt = cands.filter(x => x !== pick && dist(x) === dist(pick));
  return { dose: pick, nowhole: true, alt };
}
function rowOf(w10) {
  if (w10 < CALC_BELOW10) return null;
  return ROWS.find(r => w10 >= r.lo10 && (r.hi10 == null || w10 < r.hi10));
}
function drugItem(code, dose, w10) {
  const t = mgkg10(dose, w10), d = DRUGS[code];
  return { dose, tabs: tabsMap(code, dose), mgkg: fmt10(t), flag: null, nowhole: false, alt: [], suggest: null,
    atmax: d.cap != null && dose === d.cap && t < d.lo * 10 };
}
function regimen(age, weight) { // สเปก 4 และ 5.2
  const a = parseAge(age);
  if (!a.ok) return { ok: false, reason: 'age' };
  const p = parseWeight(weight);
  if (!p.ok) return { ok: false, reason: p.reason };
  const w10 = p.w10, row = rowOf(w10), drugs = {};
  for (const code of ORDER) {
    if (!row) {
      const c = chooseCalc(code, w10), it = drugItem(code, c.dose, w10);
      if (c.nowhole) {
        it.nowhole = true; it.alt = c.alt;
        it.flag = mgkg10(c.dose, w10) > DRUGS[code].hi * 10 ? 'yellow' : 'blue';
      }
      drugs[code] = it;
    } else {
      const it = drugItem(code, row.dose[code], w10);
      if (row.key === 'row3' && (code === 'Z' || code === 'E') && mgkg10(it.dose, w10) < DRUGS[code].lo * 10) {
        it.flag = 'blue'; it.suggest = chooseCalc(code, w10).dose;
      }
      drugs[code] = it;
    }
  }
  return { ok: true, method: row ? row.key : 'calc', w10, drugs };
}
// ป้ายของขนาดที่เภสัชแก้เอง [สเปก 5.2]
function editFlag(code, dose, w10) {
  const d = DRUGS[code], t = mgkg10(dose, w10);
  if (d.cap != null && dose > d.cap) return 'red';
  if (t > d.hi * 10) return 'yellow';
  if (t < d.lo * 10 && !(d.cap != null && dose === d.cap)) return 'blue';
  return null;
}
function adjust(age, oldWeight, newWeight, phase, current) { // สเปก 6
  const a = regimen(age, oldWeight);
  if (!a.ok) return { ok: false, reason: a.reason };
  const b = regimen(age, newWeight);
  if (!b.ok) return { ok: false, reason: b.reason };
  const codes = PHASE_DRUGS[phase], oldD = {}, newD = {}, changed = [];
  for (const c of codes) {
    oldD[c] = current && current[c] != null ? current[c] : a.drugs[c].dose;
    newD[c] = b.drugs[c].dose;
    if (oldD[c] !== newD[c]) changed.push(c);
  }
  return { ok: true, result: changed.length ? 'adjust' : 'same', changed, old: oldD, new: newD, from: a, to: b };
}

/* ---------- วันที่ (สเปก 7.1) ---------- */
function parseISO(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s)); return m ? { y: +m[1], m: +m[2], d: +m[3] } : null; }
function daysIn(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function addMonths(dt, n) {
  let y = dt.y, m = dt.m + n;
  y += Math.floor((m - 1) / 12); m = ((m - 1) % 12 + 12) % 12 + 1;
  if (dt.d > daysIn(y, m)) { m += 1; if (m > 12) { m = 1; y += 1; } return { y, m, d: 1 }; }
  return { y, m, d: dt.d };
}
function addDays(dt, n) { const t = new Date(Date.UTC(dt.y, dt.m - 1, dt.d + n)); return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() }; }
function diffDays(a, b) { return Math.round((Date.UTC(b.y, b.m - 1, b.d) - Date.UTC(a.y, a.m - 1, a.d)) / 86400000); }
function iso(dt) { return `${dt.y}-${String(dt.m).padStart(2, '0')}-${String(dt.d).padStart(2, '0')}`; }
function monthEnd(start, n) { return addDays(addMonths(start, n), -1); }
function dates(startISO) {
  const s = typeof startISO === 'string' ? parseISO(startISO) : startISO;
  const e2 = monthEnd(s, 2), c1 = addMonths(s, 2), e6 = monthEnd(s, 6);
  return { end_intensive: iso(e2), start_continuation: iso(c1), end_treatment: iso(e6),
    days_intensive: diffDays(s, e2) + 1, days_continuation: diffDays(c1, e6) + 1,
    month_end: [1, 2, 3, 4, 5, 6].map(n => iso(monthEnd(s, n))),
    _s: s, _e2: e2, _c1: c1, _e6: e6 };
}
const TH_M = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const TH_MS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
function thDate(dt) { return `${dt.d} ${TH_M[dt.m - 1]} ${dt.y + 543}`; }
function thShort(dt) { return `${dt.d} ${TH_MS[dt.m - 1]} ${String(dt.y + 543).slice(-2)}`; }

/* ---------- ข้อความ (สเปก 8) ---------- */
// plan = { w10, method, doses: {code: {dose, tabs, mgkg, edited}} } ได้จาก regimen() แล้วรวมการแก้ของเภสัช
function planFrom(reg, edits) {
  const doses = {};
  for (const c of ORDER) {
    const e = edits && edits[c];
    if (e) {
      const dose = tabsFromCounts(c, e);
      const tabs = Object.fromEntries(DRUGS[c].strengths.map(String).filter(k => Number(e[k]) > 0).map(k => [k, Number(e[k])]));
      const same = dose === reg.drugs[c].dose && JSON.stringify(tabs) === JSON.stringify(reg.drugs[c].tabs);
      doses[c] = same
        ? { dose, tabs, mgkg: reg.drugs[c].mgkg, edited: false, flag: reg.drugs[c].flag }
        : { dose, tabs, mgkg: fmt10(mgkg10(dose, reg.w10)), edited: true, flag: editFlag(c, dose, reg.w10) };
    } else {
      doses[c] = { dose: reg.drugs[c].dose, tabs: reg.drugs[c].tabs, mgkg: reg.drugs[c].mgkg, edited: false, flag: reg.drugs[c].flag };
    }
  }
  return { w10: reg.w10, method: reg.method, doses };
}
function basisText(method) {
  const row = ROWS.find(r => r.key === method);
  return row ? `ขนาดยาตามตาราง 5.1 แถว ${row.label}` : 'ขนาดยาคำนวณตามน้ำหนัก (น้อยกว่า 35 kg)';
}
const EDIT_MARK = ' (เภสัชปรับจากตาราง)';
function buildStartNote(plan, startISO) {
  const D = dates(startISO), s = D._s;
  const L = ['Pharmacist note',
    '    - เริ่มยาวัณโรค สูตร 2HRZE/4HR (ผู้ป่วยใหม่ เชื้อไวต่อยา)',
    `        - น้ำหนักก่อนเริ่มรักษา ${fmtW(plan.w10)} kg ${basisText(plan.method)}`,
    `    - ระยะเข้มข้น 2 เดือน วันที่ ${thDate(s)} ถึง ${thDate(D._e2)} (${D.days_intensive} วัน)`];
  for (const c of PHASE_DRUGS.intensive) {
    const x = plan.doses[c];
    L.push(`        - ${DRUGS[c].name} ${tabsText(c, x.tabs, 'en')} oral วันละครั้ง = ${num(x.dose)} mg (${x.mgkg} mg/kg)${x.edited ? EDIT_MARK : ''}`);
  }
  L.push(`    - ระยะต่อเนื่อง 4 เดือน วันที่ ${thDate(D._c1)} ถึง ${thDate(D._e6)} (${D.days_continuation} วัน)`);
  for (const c of PHASE_DRUGS.continuation) {
    const x = plan.doses[c];
    L.push(`        - ${DRUGS[c].name} ${tabsText(c, x.tabs, 'en')} oral วันละครั้ง = ${num(x.dose)} mg${x.edited ? EDIT_MARK : ''}`);
  }
  L.push('    - นัดติดตาม ทุกเดือนประเมินอาการและชั่งน้ำหนัก',
    `        - สิ้นเดือนที่ 2 วันที่ ${thDate(monthEnd(s, 2))}: AFB smear, CXR (ถ้า AFB บวก ตรวจ AFB ซ้ำสิ้นเดือนที่ 3 และส่งอณูชีววิทยา เพาะเชื้อ)`,
    `        - สิ้นเดือนที่ 5 วันที่ ${thDate(monthEnd(s, 5))}: AFB smear (ถ้าบวก ส่งอณูชีววิทยา เพาะเชื้อ)`,
    `        - สิ้นเดือนที่ 6 วันที่ ${thDate(monthEnd(s, 6))}: AFB smear, CXR`,
    '    - ' + REF_LINE);
  return L.join('\n');
}
function buildStartLine(plan, startISO) {
  const D = dates(startISO);
  const L = [`เริ่มยาวัณโรค 2HRZE/4HR น้ำหนัก ${fmtW(plan.w10)} กก.`,
    `2 เดือนแรก (${thShort(D._s)} ถึง ${thShort(D._e2)}) กินวันละครั้ง`];
  for (const c of PHASE_DRUGS.intensive) L.push(`- ${DRUGS[c].short} ${tabsText(c, plan.doses[c].tabs, 'th')}`);
  const cont = PHASE_DRUGS.continuation.map(c => `${DRUGS[c].short} ${tabsText(c, plan.doses[c].tabs, 'th')}`).join(' กับ ');
  L.push(`4 เดือนต่อมา (${thShort(D._c1)} ถึง ${thShort(D._e6)}) เหลือ ${cont}`, 'นัดตรวจเสมหะ สิ้นเดือนที่ 2, 5 และ 6');
  return L.join('\n');
}
function whereText(method) { const row = ROWS.find(r => r.key === method); return row ? `แถว ${row.label}` : 'คำนวณตามน้ำหนัก'; }
// adj = ผลจาก adjust() · newPlan = planFrom(adj.to, editsใหม่) · whenISO = วันที่ประเมิน
function buildAdjustNote(adj, phase, newPlan, whenISO) {
  const codes = PHASE_DRUGS[phase];
  const changed = codes.filter(c => adj.old[c] !== newPlan.doses[c].dose), same = codes.filter(c => !changed.includes(c));
  const head = changed.length ? 'ปรับขนาดยาวัณโรคตามน้ำหนัก' : 'ประเมินขนาดยาวัณโรคตามน้ำหนัก';
  const L = ['Pharmacist note', `    - ${head} วันที่ ${thDate(parseISO(whenISO))}`,
    `        - น้ำหนักเดิม ${fmtW(adj.from.w10)} kg (${whereText(adj.from.method)}) น้ำหนักใหม่ ${fmtW(adj.to.w10)} kg (${whereText(adj.to.method)})`,
    `        - อยู่${PHASE_TH[phase]}`];
  const tag = c => newPlan.doses[c].edited ? EDIT_MARK : '';
  if (changed.length) {
    L.push(`    - ปรับยา ${changed.length} รายการ`);
    for (const c of changed) {
      const x = newPlan.doses[c];
      L.push(`        - ${DRUGS[c].name} เดิม ${num(adj.old[c])} mg เป็น ${num(x.dose)} mg (${tabsText(c, x.tabs, 'en')}) oral วันละครั้ง${tag(c)}`);
    }
    if (same.length) L.push('    - คงเดิม ' + same.map(c => `${DRUGS[c].name} ${num(newPlan.doses[c].dose)} mg (${tabsText(c, newPlan.doses[c].tabs, 'en')})${tag(c)}`).join(', '));
  } else {
    L.push('    - ไม่ต้องปรับยา ขนาดเท่าเดิมทุกรายการ');
    for (const c of same) L.push(`        - ${DRUGS[c].name} ${num(newPlan.doses[c].dose)} mg (${tabsText(c, newPlan.doses[c].tabs, 'en')}) oral วันละครั้ง${tag(c)}`);
  }
  L.push('    - ' + REF_LINE);
  return L.join('\n');
}
function buildAdjustLine(adj, phase, newPlan) {
  const codes = PHASE_DRUGS[phase];
  const changed = codes.filter(c => adj.old[c] !== newPlan.doses[c].dose), same = codes.filter(c => !changed.includes(c));
  const w = `น้ำหนัก ${fmtW(adj.from.w10)} เป็น ${fmtW(adj.to.w10)} กก. ${PHASE_TH[phase]}`;
  if (!changed.length) return `${w} ไม่ต้องปรับยา กินขนาดเดิม`;
  const L = [`${w} ปรับยา`];
  for (const c of changed) L.push(`- ${DRUGS[c].short} เปลี่ยนเป็น ${num(newPlan.doses[c].dose)} มก. = ${tabsText(c, newPlan.doses[c].tabs, 'th')} (เดิม ${num(adj.old[c])} มก.)`);
  for (const c of same) L.push(`- ${DRUGS[c].short} คงเดิม ${num(newPlan.doses[c].dose)} มก. = ${tabsText(c, newPlan.doses[c].tabs, 'th')}`);
  return L.join('\n');
}
// CALC-END
</script>
</body>
</html>
